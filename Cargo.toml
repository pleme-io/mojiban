[package]
name = "mojiban"
version = "0.1.7"
edition = "2024"
rust-version = "1.89.0"
description = "Mojiban (文字盤) — rich text rendering: markdown, syntax highlighting, styled spans"
homepage = "https://github.com/pleme-io/mojiban"
repository = "https://github.com/pleme-io/mojiban"
documentation = "https://docs.rs/mojiban"
readme = "README.md"
license = "MIT"
categories = ["text-processing", "rendering"]
keywords = ["markdown", "richtext", "syntax", "highlighting", "gpu"]

[lib]
name = "mojiban"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
unicode-width = "0.2"
# TeX symbol and sub/superscript tables (port of unicodeit).
unicodeit = "0.2"
# Span + TextView's UAX #14 word wrap: the layout pass (layout.rs) emits
# egaku rows, so every pleme-io renderer draws one shape.
egaku = "0.1.20"

[dev-dependencies]
serde_json = "1"
# Fleet design-system source of truth. Used only by the colors.rs convergence
# drift test (the library analog of `ishou_tokens::convergence::Guard`) to pin
# mojiban's syntax palette to the canonical ishou Nord tokens — kept out of
# `[dependencies]` so the published library stays runtime-lean.
ishou-tokens = "0.1"
